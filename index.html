<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex | INF211</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/styles.css">
  <script src="assets/scripts/script.js" defer></script>

</head>
<body>
  <header class="text-center text-white py-4">
    <div class="pokebola mx-auto mb-3" aria-hidden="true"></div>
    <h1 class="display-5 fw-bold">Pokédex</h1>
    <p class="mb-0">Explora el mundo Pokémon · INF211</p>
  </header>
  <main class="container py-4">
    <div class="card shadow-sm p-3 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-6">
          <label for="buscar" class="form-label">Buscar por nombre</label>
          <input id="buscar" class="form-control" type="search" placeholder="Ej.: pikachu">
        </div>
        <div class="col-6 col-md-3">
          <label for="cantidad" class="form-label">Cantidad a cargar</label>
          <select id="cantidad" class="form-select"><option>12</option><option>24</option><option>48</option></select>
        </div>
        <div class="col-6 col-md-3 d-grid">
          <button id="cargar" class="btn btn-danger">Cargar / recargar</button>
        </div>
      </div>
    </div>
    <p id="estado" role="status" class="text-secondary"></p>
    <p class="fw-bold">Pokémon mostrados: <span id="contador">0</span></p>
    <section id="resultados" class="row g-3" aria-label="Resultados Pokémon"></section>
  </main>
  <footer class="text-center py-4 text-secondary">Datos de <a href="https://pokeapi.co/">PokéAPI</a> · Evaluación parcial 3</footer>
</body>
</html>
